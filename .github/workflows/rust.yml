name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check namespace consistency
      run: ./scripts/check_namespace.sh
    # build.rs compiles the gRPC protos via tonic-build, which needs protoc.
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Cache Cargo artifacts
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run isolation contract golden suite
      run: cargo test --workspace isolation_contract --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
