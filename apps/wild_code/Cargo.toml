[package]
name = "wild-code-cli"
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"

[[bin]]
name = "wildcode"
path = "src/main.rs"

[dependencies]
wild-agent-os-core = { path = "../..", features = ["ontology"] }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
glob = { workspace = true }
tempfile = { workspace = true }
# openssl-sys 是 transitive dep via reqwest→native-tls（async-openai/jsonschema 引入）
# CI 中手动预编译 musl OpenSSL + OPENSSL_DIR，不使用 openssl-src（它无法正确交叉编译 musl）

rustyline = "14"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
tui-markdown = "0.3"
mermaid-rs-renderer = { version = "0.2", default-features = false }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
