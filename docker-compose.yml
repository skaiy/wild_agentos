# Wild AgentOS Core — 单机 compose(用于 36 测试单机)
# 密钥不写此文件,通过同目录 .env 注入(见 .env.example,.env 已 gitignore)
services:
  core:
    build:
      context: .
      dockerfile: Dockerfile
    image: 10.0.0.33/wild-agentos/core:latest
    container_name: wild-agentos-core
    restart: unless-stopped
    ports:
      - "8080:8080"     # HTTP / REST / SSE /metrics (scrape here; api.metrics_port is unused)
      - "50051:50051"   # gRPC
    environment:
      RUST_LOG: info
      AGENTOS_DATA_DIR: /app/data
      AGENT_OS_HTTP_PORT: "8080"
      AGENT_OS_API_GRPC_ADDR: "0.0.0.0:50051"
      # 网关(密钥来自 .env)
      AGENT_OS_GATEWAY_BASE_URL: "https://api.deepseek.com"
      AGENT_OS_GATEWAY_DEFAULT_MODEL: "deepseek-v4-flash"
      AGENT_OS_GATEWAY_API_KEY: "${AGENT_OS_GATEWAY_API_KEY}"
      # Embedding(硅基流动 OneAPI 兼容)
      AGENT_OS_EMBEDDING_ENABLED: "true"
      AGENT_OS_EMBEDDING_PROVIDER: "oneapi"
      AGENT_OS_EMBEDDING_ONEAPI_BASE_URL: "https://api.siliconflow.cn/v1"
      AGENT_OS_EMBEDDING_ONEAPI_MODEL: "Qwen/Qwen3-Embedding-4B"
      AGENT_OS_EMBEDDING_ONEAPI_API_KEY: "${AGENT_OS_EMBEDDING_ONEAPI_API_KEY}"
    volumes:
      - core-data:/app/data
    healthcheck:
      # 运行镜像无 shell/curl：用二进制自带的 healthcheck 子命令(只请求本机 /health)
      test: ["CMD", "/usr/local/bin/wild-agent-os-core", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  core-data:
